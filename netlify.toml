# Rubba — Vite SPA on Netlify
# Publish MUST be "dist" (built assets). Never publish the repo root:
# root index.html points at /src/main.tsx (dev-only).

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_GOOGLE_AUTH = "false"
  # Supabase project rubbax (gdgseklsdpybhzkbzaeg) — values live in Netlify site env.
  # VITE_DATA_MODE — set via Netlify UI/API env (do not hardcode)
  # VITE_SUPABASE_URL — set via Netlify UI/API env (do not hardcode)
  # VITE_SUPABASE_ANON_KEY — set via Netlify UI/API env (do not hardcode)
  NODE_VERSION = "20"


# SPA deep-link fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
