# Rubba — Vite SPA on Netlify
# Publish MUST be "dist" (built assets). Never publish the repo root:
# root index.html points at /src/main.tsx (dev-only).

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_GOOGLE_AUTH = "false"
  # Live mode — set VITE_SUPABASE_* in Netlify UI as well
  VITE_DATA_MODE = "live"
  NODE_VERSION = "20"

# SPA deep-link fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
